[llm]
provider = "heuristic"
model = "offline-heuristic"
temperature = 0.7

[graph]
similarity_threshold = 0.38
max_entities_per_discipline = 40
cluster_limit = 4
min_cluster_size = 2
containment_threshold = 0.90
max_name_word_growth = 1
fission_min_gain = 0.05
cluster_max_stale = 6
use_wikipedia = false

[retrieval]
enabled = false
provider = "arxiv"
max_results = 5

[evolution]
selection_ratio = 0.5
crossover_count = 2
variation_count = 2
max_population_per_discipline = 30
fitness_decay = 0.92
min_fitness = 0.15
prune_ratio = 0.15
prune_floor_ratio = 0.80

[run]
rounds = 3
team_size = 5
ideas_per_round = 5
problem_count = 3
reviewer_count = 3
random_seed = 42
output_dir = "runs"
