[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evosci-reproduction"
version = "0.1.0"
description = "A reproducible implementation of the EvoSci scientific-idea evolution workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex reproduction" }]
dependencies = []

[project.scripts]
evosci = "evosci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
